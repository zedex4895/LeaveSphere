<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Conic-like gradient simulation with seamless multi-stop gradients -->
    <linearGradient id="grad-top-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#7FC535" />
    </linearGradient>
    <linearGradient id="grad-bottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FC535" />
      <stop offset="50%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="grad-left" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="75%" stop-color="#BC14A4" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <mask id="ring-mask">
      <circle cx="50" cy="50" r="48" fill="white" />
      <circle cx="50" cy="50" r="28" fill="black" />
    </mask>
  </defs>

  <!-- High-fidelity rainbow spectrum sphere ring matching uploaded logo -->
  <g mask="url(#ring-mask)">
    <circle cx="50" cy="50" r="48" fill="#FF4500" />
    <path d="M 50 50 L 50 0 A 50 50 0 0 1 100 50 Z" fill="url(#grad-top-right)" />
    <path d="M 50 50 L 100 50 A 50 50 0 0 1 50 100 Z" fill="url(#grad-bottom)" />
    <path d="M 50 50 L 50 100 A 50 50 0 0 1 0 50 L 50 50 Z" fill="#00B4D8" />
    <path d="M 50 50 L 0 50 A 50 50 0 0 1 50 0 L 50 50 Z" fill="url(#grad-left)" />
    <!-- Smooth overlay blur for seamless blending -->
    <circle cx="50" cy="50" r="38" stroke="url(#grad-top-right)" stroke-width="20" opacity="0.6" style="mix-blend-mode: multiply;" />
  </g>
</svg>
